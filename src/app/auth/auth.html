<div class="auth">
  <div class="auth__decor auth__decor--left">
    <img [storageSrc]="authImages.left" width="250" height="250" alt="" />
  </div>

  <div class="auth__card">
    @switch (mode()) {
      @case ('login') {
        <h2 class="auth__title">Welcome</h2>
        <form class="auth__form" [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">@</span>
              <input type="email" id="email" formControlName="email" placeholder="you@email.com" />
            </div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">*</span>
              <input
                [type]="isPasswordVisible('login') ? 'text' : 'password'"
                id="password"
                formControlName="password"
                placeholder="Enter your password"
              />
              <button
                type="button"
                class="form-field__toggle"
                (click)="togglePassword('login')"
                [attr.aria-label]="isPasswordVisible('login') ? 'Hide password' : 'Show password'"
              >
                {{ isPasswordVisible('login') ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>
          <button type="submit" [disabled]="loginForm.invalid" class="primary-button">Sign in</button>
        </form>
        <div class="auth__links">
          <button type="button" class="auth__link" (click)="setMode('register')">Create an account</button>
          <button type="button" class="auth__link" (click)="setMode('forgot-password')">Forgot password</button>
        </div>
      }

      @case ('register') {
        <h2 class="auth__title">Create Account</h2>
        <form class="auth__form" [formGroup]="registerForm" (ngSubmit)="register()">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">First name</label>
              <div class="form-field">
                <span class="form-field__icon" aria-hidden="true">A</span>
                <input type="text" id="firstName" formControlName="firstName" placeholder="First name" />
              </div>
            </div>
            <div class="form-group">
              <label for="lastName">Last name</label>
              <div class="form-field">
                <span class="form-field__icon" aria-hidden="true">A</span>
                <input type="text" id="lastName" formControlName="lastName" placeholder="Last name" />
              </div>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">@</span>
              <input type="email" id="reg-email" formControlName="email" placeholder="you@email.com" />
            </div>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">*</span>
              <input
                [type]="isPasswordVisible('register') ? 'text' : 'password'"
                id="reg-password"
                formControlName="password"
                placeholder="Create a password"
              />
              <button type="button" class="form-field__toggle" (click)="togglePassword('register')">
                {{ isPasswordVisible('register') ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">*</span>
              <input
                [type]="isPasswordVisible('confirm') ? 'text' : 'password'"
                id="confirmPassword"
                formControlName="confirmPassword"
                placeholder="Confirm password"
              />
              <button type="button" class="form-field__toggle" (click)="togglePassword('confirm')">
                {{ isPasswordVisible('confirm') ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>
          <button type="submit" [disabled]="registerForm.invalid" class="primary-button">Register</button>
        </form>
        <div class="auth__links">
          <button type="button" class="auth__link" (click)="setMode('login')">Already have an account? Sign in</button>
        </div>
      }

      @case ('forgot-password') {
        <h2 class="auth__title">Recover Password</h2>
        <p class="auth__lead">Enter your email to receive a recovery code.</p>
        <form class="auth__form" [formGroup]="forgotPasswordForm" (ngSubmit)="forgotPassword()">
          <div class="form-group">
            <label for="forgot-email">Email</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">@</span>
              <input type="email" id="forgot-email" formControlName="email" placeholder="you@email.com" />
            </div>
          </div>
          <button type="submit" [disabled]="forgotPasswordForm.invalid" class="primary-button">Send code</button>
        </form>
        <div class="auth__links">
          <button type="button" class="auth__link" (click)="setMode('login')">Back to sign in</button>
        </div>
      }

      @case ('reset-password') {
        <h2 class="auth__title">New Password</h2>
        <form class="auth__form" [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
          <div class="form-group">
            <label for="reset-email">Email</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">@</span>
              <input type="email" id="reset-email" formControlName="email" placeholder="you@email.com" />
            </div>
          </div>
          <div class="form-group">
            <label for="token">Recovery code</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">#</span>
              <input type="text" id="token" formControlName="token" placeholder="Recovery code" />
            </div>
          </div>
          <div class="form-group">
            <label for="newPassword">New password</label>
            <div class="form-field">
              <span class="form-field__icon" aria-hidden="true">*</span>
              <input
                [type]="isPasswordVisible('reset') ? 'text' : 'password'"
                id="newPassword"
                formControlName="newPassword"
                placeholder="New password"
              />
              <button type="button" class="form-field__toggle" (click)="togglePassword('reset')">
                {{ isPasswordVisible('reset') ? 'Hide' : 'Show' }}
              </button>
            </div>
          </div>
          <button type="submit" [disabled]="resetPasswordForm.invalid" class="primary-button">Reset password</button>
        </form>
        <div class="auth__links">
          <button type="button" class="auth__link" (click)="setMode('login')">Cancel</button>
        </div>
      }
    }
  </div>

  <div class="auth__decor auth__decor--right">
    <img [storageSrc]="authImages.right" width="250" height="250" alt="" />
  </div>
</div>
